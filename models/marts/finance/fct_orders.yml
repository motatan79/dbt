models:
  - name: fct_orders
    description: rounded dollars amount of order
    columns:
      - name: amount
        tests:
          - dbt_utils.expression_is_true:
              arguments: "<=5"
              config:
                # severity: warn # Para añadir la configuración que no falle sino que informe un warning
                # where: "order_date = current_date" # Para añadir que sólo considere las ordenes de hoy
                # limit: 5 # Para limitar el numero de registros a evaluar
                store_failures: true # Para guardar los valores del test cada vez que falla
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0  # (Optional)
                max_value: 100 # (Optional)
                strictly: false 
exposures:
  - name: jaffle_shop_weekly_metrics
    label: Jaffle Shop Weekly Metrics
    description: Weekly order Metrics for Jaffle Shop
    depends_on:
      - ref('fct_orders')
    owner:
      name: Moises
      email: example@email.com
    type: dashboard
    maturity: high
    url: htpps://dbtlabs